syntax = "proto3";
package valkvork.v1;

// Agent-initiated, long-lived bidirectional stream.
// First AgentMessage MUST be Register.
service AgentService {
  rpc Connect(stream AgentMessage) returns (stream ControllerMessage);
}

message AgentMessage {
  oneof msg {
    Register register = 1;
    Heartbeat heartbeat = 2;
    CommandResult command_result = 3;
    CertificateRequest certificate_request = 4; // only after RegisterAck.issues_certificates
  }
}

message ControllerMessage {
  oneof msg {
    RegisterAck register_ack = 1;
    StartWorkload start_workload = 2;
    StopWorkload stop_workload = 3;
    Endpoints endpoints = 4;           // only to agents with the service_discovery feature
    NodeCertificate node_certificate = 5; // the answer to a CertificateRequest
  }
}

// Per-node client certificates (FR-SEC-02). The agent asks for one when it
// has none or its own is two thirds through its lifetime; it presents it as
// its TLS client certificate on later connections.
message CertificateRequest {
  string csr_pem = 1;                  // PKCS#10; only its public key is used
}

message NodeCertificate {
  string certificate_pem = 1;          // empty when error is set
  string error = 2;
}

// Service discovery: every service's reachable addresses, the whole set each
// time it changes and after each Register. The agent answers DNS for them.
message Endpoints {
  uint64 version = 1;                  // increases while the controller runs; informational
  repeated ServiceEndpoints services = 2;
}

message ServiceEndpoints {
  string service_id = 1;
  repeated string addresses = 2;       // node addresses of its RUNNING (and, with a check, HEALTHY) workloads
}

message Register {
  string node_id = 1;                   // UUIDv5 of /etc/machine-id
  string join_token = 2;
  string hostname = 3;
  string ip_address = 4;
  string node_class = 5;
  string agent_version = 6;             // semver
  uint32 allocatable_cpu_millicores = 7; // capacity minus [reserved]
  uint64 allocatable_memory_bytes = 8;
  repeated string host_volumes = 9;
  repeated WorkloadStatus inventory = 10; // every Valkvork container on the host
  string runtime = 11;                  // driver/version, e.g. "docker/27.3.1"
  repeated string features = 12;        // manifest features this agent supports (AGENT_FEATURES)
  // Block volumes (docs/block-volumes.md): where the node is and how many
  // more disks it can take. Empty off a cloud, unless agent.toml sets them.
  string zone = 13;                     // e.g. "us-west-1a"
  string instance_id = 14;              // e.g. "i-0ba574f883faac8a7"
  uint32 max_block_volumes = 15;        // attachment slots for block volumes
  repeated string block_volumes = 16;   // block volumes a container on the node still uses
}

message RegisterAck {
  bool accepted = 1;
  string reject_reason = 2;
  uint32 heartbeat_interval_ms = 3;    // default 2000
  bool issues_certificates = 4;        // the controller answers CertificateRequest
}

message Heartbeat {
  uint64 seq = 1;
  double node_cpu_usage_percent = 2;
  uint64 node_used_memory_bytes = 3;
  repeated WorkloadStatus workloads = 4;
  repeated string block_volumes = 5;   // block volumes a container on the node still uses
}

enum WorkloadState {
  WORKLOAD_STATE_UNSPECIFIED = 0;
  WORKLOAD_STATE_STARTING = 1;         // pulling / creating
  WORKLOAD_STATE_RUNNING = 2;
  WORKLOAD_STATE_RESTARTING = 3;       // local restart policy in progress
  WORKLOAD_STATE_STOPPED = 4;          // stopped on request
  WORKLOAD_STATE_FAILED = 5;           // see reason
  WORKLOAD_STATE_COMPLETED = 6;        // a batch workload exited 0; never restarted
}

message WorkloadStatus {
  string workload_id = 1;
  string service_id = 2;
  uint64 service_version = 3;
  string container_id = 4;
  WorkloadState state = 5;
  string reason = 6;                   // EXITED, OOM_KILLED, IMAGE_PULL_FAILED, EPHEMERAL_DISK_EXCEEDED, ...
  int32 exit_code = 7;
  uint32 restart_count = 8;
  uint32 cpu_usage_millicores = 9;     // average since previous heartbeat
  uint64 memory_used_bytes = 10;
  uint64 disk_used_bytes = 11;
  HealthState health = 12;
}

message StartWorkload {
  string command_id = 1;
  string workload_id = 2;
  string service_id = 3;
  uint64 service_version = 4;
  string image = 5;
  uint32 cpu_millicores = 6;
  uint64 memory_bytes = 7;
  uint64 disk_bytes = 8;
  map<string, string> env = 9;
  repeated PortMapping ports = 10;
  repeated VolumeMount volumes = 11;
  RestartPolicy restart = 12;
  uint32 kill_timeout_seconds = 13;
  repeated string entrypoint = 14;     // empty: the image's
  repeated string command = 15;        // empty: the image's
  // Environment variables the agent resolves before creating the container:
  // name -> reference ("ssm:<parameter>" or "file:<path>"). Values never
  // reach the controller.
  // [env] values may contain ${secret:NAME}, NAME a key of this map; the
  // agent substitutes the resolved value.
  map<string, string> secrets = 16;
  HealthCheck check = 17;              // unset: no health check
  // Runs to completion: exit 0 is COMPLETED, not restarted. Other exits
  // follow the restart policy, as for services.
  bool batch = 18;
  ContainerSecurity security = 19;     // unset: Docker's defaults
  LogConfig logging = 20;              // unset: the node's default driver
  // Kernel parameters of the container's network namespace (net.* only;
  // `[sysctls]`): needs the agent feature "sysctls".
  map<string, string> sysctls = 21;
  // Secrets delivered as files at /run/secrets/<name> (an in-memory
  // filesystem, read-only): needs the agent feature "secret_files".
  repeated SecretFile secret_files = 22;
}

message SecretFile {
  string name = 1;
  string reference = 2;                // ssm:<parameter> or file:<path>
  string owner = 3;                    // "uid" or "uid:gid"; empty: root
  string mode = 4;                     // octal; empty: 0400 with an owner, else 0444
}

// Container hardening. Capability names are upper case, without "CAP_".
message ContainerSecurity {
  bool read_only_root = 1;
  bool no_new_privileges = 2;
  repeated string cap_drop = 3;        // "ALL" drops every capability
  repeated string cap_add = 4;
  repeated string tmpfs = 5;           // "/tmp" or "/tmp:size=64m,mode=1777"
  bool instance_metadata = 6;          // may reach 169.254.169.254 where the agent blocks it
  uint32 pids_limit = 7;               // 0: the agent's default_pids_limit
}

// The container's log driver. Option values may contain ${node.NAME},
// ${service.id} and ${workload.id}; the agent substitutes them.
message LogConfig {
  string driver = 1;
  map<string, string> options = 2;
}

// The agent probes the workload through one of its published ports, at the
// port's bind address (127.0.0.1 when it binds every address).
message HealthCheck {
  string type = 1;                     // "tcp", "http" or "exec"
  string port_name = 2;                // a PortMapping name; not for exec
  string path = 3;                     // http only
  uint32 interval_seconds = 4;
  uint32 timeout_seconds = 5;
  uint32 failures = 6;                 // consecutive failures before a restart
  uint32 grace_seconds = 7;            // after a start, failures before the first success are not counted
  repeated string command = 8;         // exec only: run in the container, healthy on exit 0
}

enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;        // no health check
  HEALTH_STATE_STARTING = 1;           // not yet passed since the container (re)started
  HEALTH_STATE_HEALTHY = 2;
  HEALTH_STATE_UNHEALTHY = 3;          // failed `failures` times in a row; being restarted
}

message PortMapping {
  string name = 1;
  uint32 container_port = 2;
  uint32 host_port = 3;
  string host_ip = 4;                  // empty: all addresses; "advertise": the node's
}

message VolumeMount {
  string type = 1;                     // host, ephemeral or block
  string source = 2;                   // block: the volume's name
  string target = 3;
  bool read_only = 4;
  string cloud_id = 5;                 // block: the attached volume (vol-…)
  string local_path = 6;               // block, local driver: a directory to bind-mount
}

message RestartPolicy {
  uint32 attempts = 1;
  uint32 interval_seconds = 2;
  uint32 delay_seconds = 3;
}

message StopWorkload {
  string command_id = 1;
  string workload_id = 2;
  uint32 kill_timeout_seconds = 3;
}

message CommandResult {
  string command_id = 1;
  string workload_id = 2;
  bool accepted = 3;
  string error = 4;
}
