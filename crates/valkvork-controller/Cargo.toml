[package]
name = "valkvork-controller"
version = "0.1.0"
edition = "2021"
authors = ["Valkvork Team"]
description = "Valkvork controller service"

[dependencies]
valkvork-common = { path = "../valkvork-common" }
valkvork-proto = { path = "../valkvork-proto" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"

# gRPC
tonic = "0.10"
prost = "0.12"

# TLS
tokio-rustls = "0.24"
rustls = { version = "0.21", features = ["dangerous_configuration"] }

# Database
rusqlite = { version = "0.29", features = ["bundled"] }

# File system
dirs = "4.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# UUID
uuid = { version = "1.4", features = ["v4", "v5", "v7", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP for web UI
hyper = "0.14"
http = "0.2"

# Metrics
prometheus = { version = "0.13", features = ["process"] }

# Collections
dashmap = "5.5"
hashbrown = "0.14"

# Regex
regex = "1.10"

# HTTP server for UI
axum = "0.7"
tower = "0.4"
tower-http = "0.5"

[build-dependencies]
tonic-build = "0.10"
