[package]
name = "valkvork-controller"
version = "0.1.0"
edition = "2021"
authors = ["Valkvork Team"]
description = "Valkvork controller service"

[dependencies]
valkvork-common = { path = "../valkvork-common" }
valkvork-proto = { path = "../valkvork-proto" }

tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.10", features = ["tls"] }
prost = "0.12"
rusqlite = { version = "0.29", features = ["bundled"] }
uuid = { version = "1.4", features = ["v7"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
clap = { version = "4.4", features = ["derive", "env"] }
# UI and metrics: the same hyper/tower stack tonic already uses (FR-UI-01).
hyper = { version = "0.14", features = ["server", "http1", "http2", "tcp", "stream"] }
http = "0.2"
tower = "0.4"
bytes = "1"
rand = "0.8"
hex = "0.4"

[build-dependencies]
flate2 = "1"

[dev-dependencies]
tempfile = "3.8"
