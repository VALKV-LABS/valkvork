[package]
name = "valkvork-loadtest"
version = "0.1.0"
edition = "2021"
authors = ["Valkvork Team"]
description = "Load harness for the controller: simulated agents, UI sessions, RSS (NFR-01, AT-11)"
publish = false

[[bin]]
name = "valkvork-loadtest"
path = "src/main.rs"

[dependencies]
valkvork-common = { path = "../valkvork-common" }
valkvork-proto = { path = "../valkvork-proto" }

tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.10", features = ["tls"] }
tower = "0.4"
http = "0.2"
http-body = "0.4"
hyper = { version = "0.14", features = ["client", "http2", "stream"] }
uuid = { version = "1.4", features = ["v5"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
