[package]
name = "valkvork-agent"
version = "0.1.0"
edition = "2021"
authors = ["Valkvork Team"]
description = "Valkvork worker agent"

[dependencies]
valkvork-common = { path = "../valkvork-common" }
valkvork-proto = { path = "../valkvork-proto" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"

# gRPC
 tonic = "0.10"
prost = "0.12"

# TLS
tokio-rustls = "0.24"
rustls = { version = "0.21", features = ["dangerous_configuration"] }

# Docker API
bollard = "0.15"

# File system
dirs = "4.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# UUID
uuid = { version = "1.4", features = ["v4", "v5", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Process
nix = { version = "0.27", features = ["fs", "process", "signal"] }

# Metrics
prometheus = { version = "0.13", features = ["process"] }

[build-dependencies]
tonic-build = "0.10"
