[package]
name = "valkvork-agent"
version = "0.1.0"
edition = "2021"
authors = ["Valkvork Team"]
description = "Valkvork worker agent"

[dependencies]
valkvork-common = { path = "../valkvork-common" }
valkvork-proto = { path = "../valkvork-proto" }

tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
tonic = { version = "0.10", features = ["tls"] }
prost = "0.12"
bollard = "0.15"
uuid = { version = "1.4", features = ["v4", "v5"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
rand = "0.8"
tracing = "0.1"
clap = { version = "4.4", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3.8"
