[package]
name = "valkvork-cli"
version = "0.1.0"
edition = "2021"
authors = ["Valkvork Team"]
description = "Valkvork CLI tool"

[[bin]]
name = "valkvork"
path = "src/main.rs"

[dependencies]
valkvork-common = { path = "../valkvork-common" }
valkvork-proto = { path = "../valkvork-proto" }

tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
tonic = { version = "0.10", features = ["tls"] }
clap = { version = "4.4", features = ["derive", "env"] }
serde = "1.0"
serde_json = "1.0"
chrono = "0.4"
