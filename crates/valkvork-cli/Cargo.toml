[package]
name = "valkvork-cli"
version = "0.1.0"
edition = "2021"
authors = ["Valkvork Team"]
description = "Valkvork CLI tool"

[[bin]]
name = "valkvork"
path = "src/main.rs"

[dependencies]
valkvork-common = { path = "../valkvork-common" }
valkvork-proto = { path = "../valkvork-proto" }

# gRPC
 tonic = "0.10"
prost = "0.12"

# TLS
tokio-rustls = "0.24"
rustls = { version = "0.21", features = ["dangerous_configuration"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# TOML parsing
toml = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File system
dirs = "4.0"

# Output formatting
comfy-table = "7.1"

# HTTP
hyper = "0.14"
http = "0.2"
