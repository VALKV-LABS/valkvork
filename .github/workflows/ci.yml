name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets release.yml run CI as a dependency.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install protobuf compiler
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install protobuf compiler
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Run unit tests
        run: cargo test --workspace --locked

  static:
    name: Static musl build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the binaries
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          target: export
          platforms: linux/amd64
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=static-amd64

      # NFR-03: no dynamic dependencies on hosts.
      - name: Check the binaries are static
        run: |
          for bin in dist/*; do
            file "$bin"
            file "$bin" | grep -q 'statically linked' || { echo "$bin is not statically linked"; exit 1; }
          done
