name: Release

# Every push to main publishes both images as `edge`, which also keeps the
# build cache warm for releases.
#
# Releasing is a decision: tag.yml tags every green commit on main with the
# next version automatically, and you choose which tag to release:
#
#   gh workflow run release.yml -f tag=v0.1.3     (or Actions → Release → Run workflow)
#
# Pushing a tag vX.Y.Z yourself also releases it. (Tags created by tag.yml do
# not trigger this, because GitHub never starts workflows from events made with
# the workflow token.)
#
# A release builds the tag's commit with the tag's version stamped into the
# crates (scripts/set-version.sh), publishes both images for amd64 and arm64 as
# X.Y.Z, X.Y and latest, and creates a GitHub release with static binaries as
# valkvork-X.Y.Z-linux-<x86_64|aarch64>.tar.gz, the layout the golden image
# installer downloads (valkvork_download_url). The tag's commit must have
# passed CI on main.
#
# Images:
#   valkvlabs/valkvork-controller   controller + valkvork CLI
#   valkvlabs/valkvork-agent        agent + valkvork CLI
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME — Docker Hub username (valkvlabs)
#   DOCKERHUB_TOKEN    — Docker Hub access token (hub.docker.com → Account Settings → Security)

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.3 (tag.yml creates one per green commit on main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # ── What to build ────────────────────────────────────────────────────────────
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the commit and version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            # A push to main: edge images only.
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$tag is not a vX.Y.Z tag"; exit 1; }
          sha=$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}") \
            || { echo "::error::tag $tag does not exist"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::$tag ($sha) is not on main"; exit 1; }
          # Only commits that passed CI on main are released.
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --commit "$sha" --status success --json databaseId --jq length)
          [ "$passed" -gt 0 ] || { echo "::error::CI has not passed on main for $sha"; exit 1; }
          {
            echo "release=true"
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag ($sha)" >> "$GITHUB_STEP_SUMMARY"

  # ── Images ────────────────────────────────────────────────────────────────────
  # Each platform builds on its own hardware, because compiling Rust under
  # emulation takes hours. Both images and the raw binaries come from the same
  # build stage, so the second and third builds reuse the first.
  build:
    name: Build ${{ matrix.arch }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            uname: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            uname: aarch64
            runner: ubuntu-24.04-arm
    env:
      # The build record is not an archive the publish job can unpack, and
      # nothing here reads it.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      RELEASE: ${{ needs.plan.outputs.release }}
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      # Binaries report the release version in --version; the golden image
      # installer checks it. The committed crate version stays as it is.
      - name: Stamp the version
        if: env.RELEASE == 'true'
        run: scripts/set-version.sh "$VERSION"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image labels
        id: labels
        run: |
          version=$([ "$RELEASE" = true ] && echo "$VERSION" || echo "edge-$SHA")
          {
            echo 'value<<EOF'
            echo "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
            echo "org.opencontainers.image.revision=$SHA"
            echo "org.opencontainers.image.version=$version"
            echo "org.opencontainers.image.licenses=Apache-2.0"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push the controller by digest
        id: controller
        uses: docker/build-push-action@v6
        with:
          context: .
          target: controller
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.labels.outputs.value }}
          outputs: type=image,name=valkvlabs/valkvork-controller,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=valkvork-${{ matrix.arch }}
          cache-to: type=gha,scope=valkvork-${{ matrix.arch }},mode=max

      - name: Build and push the agent by digest
        id: agent
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.labels.outputs.value }}
          outputs: type=image,name=valkvlabs/valkvork-agent,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=valkvork-${{ matrix.arch }}

      - name: Export the binaries
        uses: docker/build-push-action@v6
        with:
          context: .
          target: export
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=dist
          # Keep dist/ to the binaries (no provenance.json attestation file).
          provenance: false
          cache-from: type=gha,scope=valkvork-${{ matrix.arch }}

      - name: Check and package the binaries
        run: |
          mkdir -p digests
          echo "${{ steps.controller.outputs.digest }}" > "digests/valkvork-controller-${{ matrix.arch }}"
          echo "${{ steps.agent.outputs.digest }}" > "digests/valkvork-agent-${{ matrix.arch }}"
          for bin in dist/valkvork-controller dist/valkvork-agent dist/valkvork; do
            file "$bin" | grep -qE 'statically linked|static-pie linked' || { echo "$bin is not statically linked"; exit 1; }
          done
          version=$([ "$RELEASE" = true ] && echo "$VERSION" || echo edge)
          # Release binaries must report the release version.
          if [ "$RELEASE" = true ] && [ "${{ matrix.arch }}" = amd64 ]; then
            reported=$(dist/valkvork --version | awk '{print $2}')
            [ "$reported" = "$VERSION" ] || { echo "binaries report $reported, expected $VERSION"; exit 1; }
          fi
          mkdir -p tarballs
          tar -C dist -czf "tarballs/valkvork-${version}-linux-${{ matrix.uname }}.tar.gz" \
            valkvork-controller valkvork-agent valkvork

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: tarballs/*
          retention-days: 7

  publish:
    name: Publish images
    needs: [plan, build]
    runs-on: ubuntu-24.04
    env:
      RELEASE: ${{ needs.plan.outputs.release }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Join the platforms under one tag
        run: |
          if [ "$RELEASE" = true ]; then
            tags="$VERSION ${VERSION%.*} latest"
          else
            tags=edge
          fi
          for component in valkvork-controller valkvork-agent; do
            image="valkvlabs/$component"
            sources=""
            for arch in amd64 arm64; do
              sources="$sources $image@$(cat "digests/$component-$arch")"
            done
            args=""
            for tag in $tags; do args="$args -t $image:$tag"; done
            # shellcheck disable=SC2086
            docker buildx imagetools create $args $sources
            docker buildx imagetools inspect "$image:${tags%% *}"
          done

  # ── GitHub release ────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: [plan, publish]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: release
          merge-multiple: true

      - name: Checksums and notes
        run: |
          (cd release && sha256sum -- *.tar.gz > SHA256SUMS)
          {
            echo "## Docker images"
            echo
            echo '```'
            echo "docker pull valkvlabs/valkvork-controller:$VERSION"
            echo "docker pull valkvlabs/valkvork-agent:$VERSION"
            echo '```'
            echo
            echo "## Static binaries"
            echo
            echo "\`valkvork-$VERSION-linux-x86_64.tar.gz\` and \`valkvork-$VERSION-linux-aarch64.tar.gz\`"
            echo "contain \`valkvork-controller\`, \`valkvork-agent\` and \`valkvork\`. For the golden image:"
            echo
            echo '```'
            echo "packer build -var orchestrator=valkvork -var valkvork_version=$VERSION \\"
            echo "  -var valkvork_download_url=${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG ."
            echo '```'
          } > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          body_path: notes.md
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/SHA256SUMS
