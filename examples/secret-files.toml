# Postgres with its password delivered as a file: [secrets] with file = true.
#
# The agent resolves the reference just before it creates the container and
# writes the value to /run/secrets/POSTGRES_PASSWORD, on an in-memory
# filesystem mounted read-only. The value is not in the container's
# environment, not in `docker inspect`, and never on a disk. The official
# image reads it through POSTGRES_PASSWORD_FILE.
#
# owner = "999:999" is the postgres user of the Debian-based image (70:70 for
# -alpine), so only Postgres can read the file (mode 0400 by default with an
# owner). Every 5 minutes (agent.toml secrets.refresh_seconds) the agent
# resolves it again and replaces the file if the value changed; Postgres
# reads it only when it initialises its data directory, so rotating this
# password still needs ALTER ROLE.
#
# Try it with `make dev-up`: put the password in .dev/secrets/pg_password, set
# ref to that file's absolute path, and drop owner (the development agent runs
# as your user, so it cannot give files to another one; the file is then 0444).
# Then:
#   valkvork apply -f examples/secret-files.toml
#   docker exec <container> ls -l /run/secrets      # on a node: -r-------- 999 999 POSTGRES_PASSWORD
#   docker inspect <container> | grep -c <password> # 0
[service]
id           = "postgres-secret-file"
image        = "docker.io/library/postgres:16.4"
replicas     = 1
kill_timeout = "30s"

[resources]
cpu    = 0.5
memory = "512MiB"

[[ports]]
name           = "postgres"
container_port = 5432
host_port      = 15433

[env]
POSTGRES_PASSWORD_FILE = "/run/secrets/POSTGRES_PASSWORD"

[secrets]
# On a cell: "ssm:/valkv/<cell>/workloads/POSTGRES_PASSWORD".
POSTGRES_PASSWORD = { ref = "file:/path/to/valkvork/.dev/secrets/pg_password", file = true, owner = "999:999" }
